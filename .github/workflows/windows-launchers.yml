name: Native Windows launchers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-launchers:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run hidden fake-command and shortcut integration checks
        run: python -m unittest discover -s tests -p test_windows.py -v
