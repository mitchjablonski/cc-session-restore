name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 predates Ubuntu 26.04 and macOS arm64 distributions.
        os: [ubuntu-22.04, macos-15-intel, windows-latest]
        python: ['3.8', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Stdlib unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic CLI JSON and dry-run smoke
        run: python tests/smoke.py
