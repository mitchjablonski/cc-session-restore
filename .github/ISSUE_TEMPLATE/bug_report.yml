name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't paste private details.** Session titles, folder paths, user names and transcript text can all be personal. Replace them with placeholders such as `~/project-a` or `my session` before you submit.

        For a security problem, don't open an issue. See [SECURITY.md](https://github.com/mitchjablonski/cc-session-restore/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - WSL (with Windows Terminal)
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2 with Ubuntu 24.04 in WSL, macOS 15.1, Fedora 41
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal you run Claude Code in, and the one sessions open in if it's different. Say if you set `--terminal` or `CC_SESSION_RESTORE_TERMINAL`.
      placeholder: e.g. Windows Terminal, iTerm2, GNOME Terminal, tmux inside kitty
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: cc-session-restore version
      description: The commit you're on (`git rev-parse --short HEAD` in your clone), or the date you downloaded it.
  - type: dropdown
    id: mode
    attributes:
      label: How did you run it?
      options:
        - The "Claude Code sessions" launcher, or --gui
        - The terminal picker
        - list, --json or -y
        - --install
        - Other
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cc-session-restore doctor`
      description: If your version has the `doctor` command, paste its output here. Check it for private paths first.
      render: text
  - type: textarea
    id: output
    attributes:
      label: Other output
      description: Error messages, or the output of the same command with `--dry-run`. Check it for private paths first.
      render: text
